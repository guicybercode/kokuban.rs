name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
          - name: Linux graphical shell
            runner: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.94.1
        shell: bash
        run: |
          rustup toolchain install 1.94.1 --profile minimal --component clippy
          rustup default 1.94.1
          rustc --version

      - name: Install Linux display test dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libxkbcommon-x11-0 \
            xauth \
            xvfb

      - name: Check all targets
        run: cargo check --locked --all-targets

      - name: Test all targets
        run: cargo test --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets

      - name: Verify macOS dependency isolation
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if cargo tree --locked | grep -E '(winit|softbuffer) v'; then
            echo "Linux-only window dependencies are present in the macOS dependency tree"
            exit 1
          fi

      - name: Verify Linux dependency isolation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if cargo tree --locked | grep -E '(objc2|block2|font-kit|pathfinder_geometry|drm) v'; then
            echo "Apple-only or KMS/DRM dependencies are present in the Linux dependency tree"
            exit 1
          fi

      - name: Verify clean Linux display failure
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --locked
          set +e
          linux_message="$(env \
            -u DISPLAY \
            -u WAYLAND_DISPLAY \
            -u WAYLAND_SOCKET \
            -u XDG_RUNTIME_DIR \
            timeout 5s target/debug/kokuban 2>&1)"
          linux_exit_code=$?
          set -e

          if [[ $linux_exit_code -ne 1 ]]; then
            echo "Expected display initialization to exit with status 1, got $linux_exit_code"
            exit 1
          fi

          linux_error="${linux_message##*$'\n'}"
          if [[ "$linux_error" != "kokuban: failed to initialize Linux window:"* ]]; then
            echo "Unexpected Linux display error: $linux_message"
            exit 1
          fi

          if grep -Eq 'panicked at|thread .* panicked' <<<"$linux_message"; then
            echo "Linux display initialization panicked: $linux_message"
            exit 1
          fi

      - name: Smoke test the first Linux frame under Xvfb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          env \
            -u WAYLAND_DISPLAY \
            -u WAYLAND_SOCKET \
            -u XDG_RUNTIME_DIR \
            KOKUBAN_EXIT_AFTER_FIRST_FRAME=1 \
            xvfb-run --auto-servernum timeout 10s target/debug/kokuban
