name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
          - name: Linux graphical shell
            runner: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.94.1
        shell: bash
        run: |
          rustup toolchain install 1.94.1 --profile minimal --component clippy
          rustup default 1.94.1
          rustc --version

      - name: Install Linux display and font dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            desktop-file-utils \
            ffmpeg \
            fonts-dejavu-core \
            libfontconfig1-dev \
            libfreetype6-dev \
            libxkbcommon-x11-0 \
            fzf \
            mpv \
            neovim \
            openssh-client \
            openssh-server \
            pkg-config \
            tmux \
            x11-apps \
            x11-utils \
            x11-xserver-utils \
            xauth \
            xclip \
            xdotool \
            xvfb

      - name: Test real clear fixture and pixel evidence
        run: python3 -m unittest discover -s scripts -p test_linux_clear_fixture.py

      - name: Test local Responses and Messages streaming fixture
        run: python3 -m unittest discover -s scripts -p test_tui_fixture_server.py

      - name: Test pinned CLI prompt and resize observations
        run: python3 -m unittest discover -s scripts -p test_linux_ai_tui_smoke.py

      - name: Check all targets
        run: cargo check --locked --all-targets

      - name: Test all targets
        run: cargo test --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets

      - name: Verify macOS dependency isolation
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if cargo tree --locked | grep -E '(winit|softbuffer|freetype-sys|yeslogic-fontconfig-sys) v'; then
            echo "Linux-only window or font dependencies are present in the macOS dependency tree"
            exit 1
          fi

      - name: Verify Linux dependency isolation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          linux_tree="$(cargo tree --locked)"

          for dependency in font-kit freetype-sys yeslogic-fontconfig-sys pathfinder_geometry; do
            if ! grep -q "$dependency v" <<<"$linux_tree"; then
              echo "Required Linux font dependency is missing: $dependency"
              exit 1
            fi
          done

          if grep -E '(objc2|block2|core-foundation|core-graphics|core-text|drm) v' <<<"$linux_tree"; then
            echo "Apple-only or KMS/DRM dependencies are present in the Linux dependency tree"
            exit 1
          fi

      - name: Verify clean Linux display failure
        id: linux_build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --locked
          kokuban_binary="$PWD/target/debug/kokuban"
          display_check_directory="$(mktemp -d)"
          trap 'rmdir "$display_check_directory"' EXIT
          set +e
          linux_message="$(
            cd "$display_check_directory"
            env \
              -u DISPLAY \
              -u WAYLAND_DISPLAY \
              -u WAYLAND_SOCKET \
              -u XDG_RUNTIME_DIR \
              timeout 5s "$kokuban_binary" 2>&1
          )"
          linux_exit_code=$?
          set -e

          if [[ $linux_exit_code -ne 1 ]]; then
            echo "Expected display initialization to exit with status 1, got $linux_exit_code"
            exit 1
          fi

          linux_error="${linux_message##*$'\n'}"
          if [[ "$linux_error" != "kokuban: failed to initialize Linux window:"* ]]; then
            echo "Unexpected Linux display error: $linux_message"
            exit 1
          fi

          if grep -Eq 'panicked at|thread .* panicked' <<<"$linux_message"; then
            echo "Linux display initialization panicked: $linux_message"
            exit 1
          fi

      - name: Smoke test the first Linux frame under Xvfb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          kokuban_binary="$PWD/target/debug/kokuban"
          smoke_directory="$(mktemp -d)"
          trap 'rmdir "$smoke_directory"' EXIT

          for scale_factor in 1 2; do
            (
              cd "$smoke_directory"
              env \
                -u WAYLAND_DISPLAY \
                -u WAYLAND_SOCKET \
                -u XDG_RUNTIME_DIR \
                KOKUBAN_EXIT_AFTER_FIRST_FRAME=1 \
                WINIT_X11_SCALE_FACTOR="$scale_factor" \
                xvfb-run --auto-servernum timeout 10s "$kokuban_binary"
            )
          done

      - name: Verify the embedded Linux application icon
        if: runner.os == 'Linux'
        shell: bash
        run: |
          desktop-file-validate assets/io.github.guicybercode.kokuban.desktop
          xvfb-run --auto-servernum --server-args="-screen 0 800x600x24" \
            timeout --kill-after=5s 30s python3 scripts/linux-icon-smoke.py \
              "$PWD/target/debug/kokuban"

      - name: Verify presented Linux images and frame replacement
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 800x600x24" \
            timeout 90s python3 scripts/linux-graphics-smoke.py "$PWD/target/debug/kokuban"

      - name: Verify synchronized Linux presentation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 800x600x24" \
            timeout --kill-after=5s 30s python3 scripts/linux-sync-smoke.py \
              "$PWD/target/debug/kokuban" --artifacts target/linux-sync-smoke

      - name: Upload synchronized presentation evidence
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-sync-smoke
          path: target/linux-sync-smoke
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify Linux clipboard and mouse selection
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 800x600x24" \
            timeout --kill-after=10s 90s python3 scripts/linux-clipboard-smoke.py \
              "$PWD/target/debug/kokuban" --artifacts target/linux-clipboard-smoke

      - name: Upload Linux clipboard diagnostics
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-clipboard-smoke
          path: target/linux-clipboard-smoke
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify real mpv Kitty video and pause under Xvfb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 800x600x24" \
            timeout --kill-after=5s 90s python3 scripts/linux-video-smoke.py \
              "$PWD/target/debug/kokuban" --build-profile debug \
              --artifacts-dir "$RUNNER_TEMP/kokuban-video-artifacts"

      - name: Upload Linux video smoke evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-video-smoke
          path: ${{ runner.temp }}/kokuban-video-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify Linux SSH and interactive development applications
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24 -noreset" \
            timeout --kill-after=10s 180s python3 scripts/linux-apps-smoke.py \
              "$PWD/target/debug/kokuban" \
              --artifacts-dir "$RUNNER_TEMP/kokuban-apps-artifacts"

      - name: Upload Linux application smoke evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-apps-smoke
          path: ${{ runner.temp }}/kokuban-apps-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Install Node for pinned interactive CLIs
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.linux_build.outcome == 'success' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install exact Claude Code and Codex fixture clients
        id: ai_clients
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.linux_build.outcome == 'success' }}
        shell: bash
        run: |
          cli_directory="$RUNNER_TEMP/kokuban-fixture-clients"
          mkdir -p "$cli_directory" target/linux-ai-tui/packages
          npm install --prefix "$cli_directory" --save-exact --ignore-scripts \
            --no-audit --no-fund --registry=https://registry.npmjs.org \
            @openai/codex@0.153.4 @anthropic-ai/claude-code@2.1.261
          # This package's installer links the exact platform binary already
          # fetched by npm; other lifecycle scripts remain disabled.
          node "$cli_directory/node_modules/@anthropic-ai/claude-code/install.cjs"
          cli_bin="$cli_directory/node_modules/.bin"
          echo "$cli_bin" >> "$GITHUB_PATH"
          [[ "$("$cli_bin/codex" --version)" == "codex-cli 0.153.4" ]]
          [[ "$("$cli_bin/claude" --version)" == "2.1.261 (Claude Code)" ]]
          cp "$cli_directory/package-lock.json" target/linux-ai-tui/packages/package-lock.json
          {
            node --version
            npm --version
            "$cli_bin/codex" --version
            "$cli_bin/claude" --version
            git rev-parse HEAD
            sha256sum target/debug/kokuban
          } > target/linux-ai-tui/packages/versions.txt

      - name: Verify real Codex TUI with localhost streaming over SSH
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.ai_clients.outcome == 'success' }}
        shell: bash
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24 -noreset" \
            timeout --kill-after=5s 120s python3 scripts/linux-ai-tui-smoke.py \
              "$PWD/target/debug/kokuban" --client codex \
              --artifacts target/linux-ai-tui/codex

      - name: Verify real Claude Code TUI with localhost streaming over SSH
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.ai_clients.outcome == 'success' }}
        shell: bash
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24 -noreset" \
            timeout --kill-after=5s 120s python3 scripts/linux-ai-tui-smoke.py \
              "$PWD/target/debug/kokuban" --client claude \
              --artifacts target/linux-ai-tui/claude

      - name: Upload real CLI terminal evidence
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-ai-tui
          path: target/linux-ai-tui
          if-no-files-found: ignore
          retention-days: 7
