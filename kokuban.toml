[font]
# Omit family to use system monospace on Linux or Menlo on macOS.
# family = "DejaVu Sans Mono"
size = 14.0
zoom_step = 1.0
min_size = 6.0
max_size = 72.0

[window]
columns = 80
rows = 24
opacity = 1.0

# Factory theme: chalkboard green with chalk-colored text.
[colors]
foreground = "#f4f6f0"
background = "#1f3a2a"
# cursor = "#f4f6f0"

# Selection is chalk inverted: board-green text on a chalk block.
[selection]
foreground = "#1f3a2a"
background = "#f4f6f0"

[status_bar]
enabled = true
show_shell = true
show_cwd = true
show_pane_index = true

[update]
# Check GitHub for a newer release in the background after launch.
# Install it with `kokuban --update` or, on macOS, from the app menu.
check_on_startup = true

[notifications]
# Desktop notifications for OSC 9 / 777 / 99, and Dock/taskbar attention for BEL.
enabled = true
# Optional helper invoked with title/body in KOKUBAN_NOTIFICATION_TITLE / _BODY only
# (never through a shell). Leave unset to use the built-in notify-send / osascript path.
# Do not set this to notify-send itself — that binary expects argv, not these env vars.
# command = "/usr/local/bin/kokuban-notify-hook"

[clipboard]
# Allow programs (tmux, Neovim, SSH sessions) to copy text to the system clipboard
# with OSC 52. Only writes are honoured; clipboard reads are never answered.
osc52_write = true

[prompt_marks]
enabled = true
show_indicator = true
indicator_color = "#b5312c"

# Window chrome stays in the board family; hanko red is the single accent.
[theme.chrome]
sumi_black  = "#142619"
sumi_dark   = "#182e21"
sumi_medium = "#3b5a48"
sumi_light  = "#c9d3c6"
sumi_ghost  = "#2d4a3a"
hanko_red   = "#b5312c"
hanko_dim   = "#6b2320"

[keybind]
split_vertical   = "cmd+d"
split_horizontal = "cmd+shift+d"
close_pane       = "cmd+w"
focus_left       = "cmd+h"
focus_down       = "cmd+j"
focus_up         = "cmd+k"
focus_right      = "cmd+l"
resize_left      = "cmd+shift+h"
resize_down      = "cmd+shift+j"
resize_up        = "cmd+shift+k"
resize_right     = "cmd+shift+l"
zoom_in          = "cmd+="
zoom_out         = "cmd+-"
zoom_reset       = "cmd+0"
prev_prompt      = "cmd+up"
next_prompt      = "cmd+down"
# Jump to the next pane marked with ● (BEL or notification while unwatched).
focus_attention  = "cmd+shift+a"

[keybind.resize]
step = 20
