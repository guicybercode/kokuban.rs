[font]
# Omit family to use system monospace on Linux or Menlo on macOS.
# family = "DejaVu Sans Mono"
size = 14.0
zoom_step = 1.0
min_size = 6.0
max_size = 72.0
# Ligaduras de fontes de programação (Fira Code, JetBrains Mono, Cascadia).
# Experimental: só o renderizador Metal (macOS) e só texto ASCII.
# ligatures = false

[window]
columns = 80
rows = 24
opacity = 1.0

# Factory theme: chalkboard green with chalk-colored text.
[colors]
foreground = "#f4f6f0"
background = "#1f3a2a"
# cursor = "#f4f6f0"

# Selection is chalk inverted: board-green text on a chalk block.
[selection]
foreground = "#1f3a2a"
background = "#f4f6f0"

[status_bar]
enabled = true
show_shell = true
show_cwd = true
show_pane_index = true

[update]
# Check GitHub for a newer release in the background after launch.
# Install it with `kokuban --update` or, on macOS, from the app menu.
check_on_startup = true

[notifications]
# Desktop notifications for OSC 9 / 777 / 99, and Dock/taskbar attention for BEL.
enabled = true
# Optional helper invoked with title/body in KOKUBAN_NOTIFICATION_TITLE / _BODY only
# (never through a shell). Leave unset to use the built-in notify-send / osascript path.
# Do not set this to notify-send itself — that binary expects argv, not these env vars.
# Only read from ~/.config/kokuban/kokuban.toml: a kokuban.toml in the launch
# directory cannot make Kokuban run a program, and this key is ignored there.
# command = "/usr/local/bin/kokuban-notify-hook"

[images.kitty]
# Let kitty-protocol clients ask Kokuban to read an image from a local path
# (t=f / t=t). Set to false to keep every transfer in the terminal byte stream.
# Only read from ~/.config/kokuban/kokuban.toml: a kokuban.toml in the launch
# directory always behaves as if this were false.
allow_file_transfer = true

[clipboard]
# Allow programs (tmux, Neovim, SSH sessions) to copy text to the system clipboard
# with OSC 52. Only writes are honoured; clipboard reads are never answered.
osc52_write = true
# Linux: a mouse selection becomes the PRIMARY selection and the middle button
# pastes it (Shift+middle while a program such as Vim or tmux uses the mouse).
primary_selection = true

[input]
# macOS: which Option key sends ESC-prefixed Meta sequences. "both" (default),
# "left" or "right" keep the other side for accents (∫, ç); "none" lets macOS
# compose text with both keys.
option_as_alt = "both"

[prompt_marks]
enabled = true
show_indicator = true
indicator_color = "#b5312c"

# Window chrome stays in the board family; hanko red is the single accent.
[theme.chrome]
sumi_black  = "#142619"
sumi_dark   = "#182e21"
sumi_medium = "#3b5a48"
sumi_light  = "#c9d3c6"
sumi_ghost  = "#2d4a3a"
hanko_red   = "#b5312c"
hanko_dim   = "#6b2320"

[keybind]
split_vertical   = "cmd+d"
split_horizontal = "cmd+shift+d"
close_pane       = "cmd+w"
focus_left       = "cmd+h"
focus_down       = "cmd+j"
focus_up         = "cmd+k"
focus_right      = "cmd+l"
resize_left      = "cmd+shift+h"
resize_down      = "cmd+shift+j"
resize_up        = "cmd+shift+k"
resize_right     = "cmd+shift+l"
zoom_in          = "cmd+="
zoom_out         = "cmd+-"
zoom_reset       = "cmd+0"
prev_prompt      = "cmd+up"
next_prompt      = "cmd+down"
search           = "cmd+f"
# Jump to the next pane marked with ● (BEL or notification while unwatched).
focus_attention  = "cmd+shift+a"

[keybind.resize]
step = 20

# Linux uses its own table (Super belongs to the window manager, and
# Ctrl+Shift+C/V/A, Ctrl+Insert and Shift+Insert stay clipboard chords).
# Key names: a single character, `plus`/`minus`, `f1`..`f12`, `up`, `down`,
# `left`, `right`, `pageup`, `pagedown`, `home`, `end`, `tab`, `esc`, `enter`,
# `backspace`, `space`, `insert`, `delete`; modifiers `ctrl`, `alt`, `shift`,
# `super`. These are the defaults:
# [keybind.linux]
# split_vertical   = "ctrl+shift+d"
# split_horizontal = "ctrl+shift+e"
# close_pane       = "ctrl+shift+w"
# focus_left       = "ctrl+shift+h"
# focus_down       = "ctrl+shift+j"
# focus_up         = "ctrl+shift+k"
# focus_right      = "ctrl+shift+l"
# resize_left      = "ctrl+alt+shift+h"
# resize_down      = "ctrl+alt+shift+j"
# resize_up        = "ctrl+alt+shift+k"
# resize_right     = "ctrl+alt+shift+l"
# zoom_in          = "ctrl+shift+plus"   # "ctrl+shift+=" also works
# zoom_out         = "ctrl+shift+minus"
# zoom_reset       = "ctrl+shift+0"
# prev_prompt      = "ctrl+shift+up"
# next_prompt      = "ctrl+shift+down"
# search           = "ctrl+shift+f"
# focus_attention  = "ctrl+shift+n"
#
# [keybind.linux.resize]
# step = 20
