[package]
name = "kokuban-ssh"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
publish = false

[dependencies]
anyhow = "1.0"
libc = "0.2"
ring = "=0.17.14"
russh = { version = "=0.63.2", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "=1.53.1", features = ["rt", "net", "io-util", "macros", "signal", "time"] }
zeroize = "1.8"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35
