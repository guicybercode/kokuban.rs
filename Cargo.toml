[package]
name = "kokuban"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dev-dependencies]
fontdue = { version = "=0.9.3", default-features = false, features = ["std", "simd"] }

[dependencies]
nix = { version = "0.29", features = ["term", "fs", "process", "signal", "poll"] }
toml = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"
bitflags = "2"
unicode-width = "0.2"
png = "0.17"
flate2 = "1"
base64 = "0.22"

[target.'cfg(not(target_os = "android"))'.dependencies]
font-kit = "0.14"
pathfinder_geometry = "0.5"

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "android-native-activity"] }
softbuffer = { version = "0.4.8", default-features = false }
fontdue = { version = "=0.9.3", default-features = false, features = ["std", "simd"] }
android_logger = "0.15"

[package.metadata.android]
package = "com.kokuban.terminal"
apk_name = "kokuban"
build_targets = ["aarch64-linux-android"]
strip = "split"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "Kokuban"
theme = "@android:style/Theme.Material.NoActionBar"
extract_native_libs = true

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize|smallestScreenSize|screenLayout|uiMode|density|keyboard|navigation"
launch_mode = "singleTop"
exported = true
resizeable_activity = true

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSRunLoop", "NSString", "NSNotification", "NSThread", "NSProcessInfo", "NSDictionary", "NSArray"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWindow", "NSView", "NSEvent", "NSResponder", "NSScreen", "NSMenu", "NSMenuItem", "NSRunningApplication", "NSGraphics", "NSColor", "NSText"] }
objc2-metal = { version = "0.3", features = ["MTLDevice", "MTLCommandQueue", "MTLCommandBuffer", "MTLRenderCommandEncoder", "MTLRenderPipeline", "MTLLibrary", "MTLBuffer", "MTLTexture", "MTLResource", "MTLVertexDescriptor", "MTLSampler", "MTLRenderPass", "MTLPixelFormat", "MTLDrawable"] }
objc2-quartz-core = { version = "0.3", features = ["CAMetalLayer", "CALayer", "objc2-metal"] }
block2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
softbuffer = { version = "0.4.8", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
